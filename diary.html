<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>OM SANSKAR - Diary</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="google-site-verification" content="d0wkB4IEYuCL7a86CknBhYWhtrP8g87WdtquUYa4i4g" />
<style>
:root{
  --bg1:#4169e1; --bg2:#87ceeb; --bg3:#000080;
  --card:rgba(255,255,255,0.85); --text:#000; --btn:#800080; --danger:#ff4d4d;
}
body.dark{
  --bg1:#4169e1; --bg2:#87ceeb; --bg3:#000080; --card:rgba(0,0,0,0.85); --text:#fff; --btn:#800080;
}
body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,var(--bg1),var(--bg2),var(--bg3));color:var(--text);min-height:100vh;}
.container{max-width:700px;margin:auto;padding:20px;text-align:center;}
h1.title{font-family:'Comic Sans MS',cursive,sans-serif;font-size:2rem;margin-bottom:10px;}
nav{margin-bottom:15px;}
nav button{margin:0 5px;padding:8px 12px;font-weight:bold;border:none;border-radius:5px;cursor:pointer;background:var(--btn);color:#fff;}
.card{background:var(--card);padding:15px;border-radius:12px;text-align:left;margin-bottom:15px;}
input,textarea,button{width:100%;padding:10px;margin-top:10px;border:none;border-radius:8px;}
button{background:var(--btn);color:#fff;font-size:16px;cursor:pointer;}
.entry{background:rgba(255,255,255,0.15);padding:10px;border-radius:8px;margin-top:10px;display:flex;justify-content:space-between;align-items:center;}
.entry-buttons button{margin-left:5px;}
</style>
</head>
<body>
<div class="container">
  <h1 class="title">OM SANSKAR - Diary</h1>
  <button id="themeToggle">🌙 Toggle Theme</button>
  <nav>
    <button onclick="location.href='index.html'">Tasks</button>
    <button onclick="location.href='diary.html'">Diary</button>
    <button onclick="location.href='stats.html'">Stats</button>
  </nav>

  <div class="card">
    <input id="entryTitle" placeholder="Title">
    <textarea id="entryText" placeholder="Write your diary or to-do here..." rows="4"></textarea>
    <button id="addEntry">Add Entry</button>
  </div>

  <div id="entriesList"></div>
  <a href="https://youtube.com/@lordlofi-014?si=688afuY83MkdbTpq"><button style="margin-top:15px">LORD LOFI EDITZ</button></a>
</div>

<script>
let entries=JSON.parse(localStorage.getItem("diaryEntries")||"[]");
const entriesDiv=document.getElementById("entriesList");

function saveEntries(){localStorage.setItem("diaryEntries",JSON.stringify(entries));}

function renderEntries(){
  entriesDiv.innerHTML="";
  entries.forEach((e,i)=>{
    const div=document.createElement("div");
    div.className="entry";
    div.innerHTML=`
      <div><strong>${e.title}</strong><p>${e.text}</p></div>
      <div class="entry-buttons">
        <button class="share">Share</button>
        <button class="delete">Delete</button>
      </div>
    `;
    div.querySelector(".delete").onclick=()=>{
      entries.splice(i,1);
      saveEntries();
      renderEntries();
    };
    div.querySelector(".share").onclick=()=>{
      const text=encodeURIComponent(e.title+"\n"+e.text);
      window.open("https://wa.me/?text="+text,"_blank");
    };
    entriesDiv.appendChild(div);
  });
}

document.getElementById("addEntry").onclick=()=>{
  const title=document.getElementById("entryTitle").value.trim();
  const text=document.getElementById("entryText").value.trim();
  if(!title||!text)return;
  entries.push({title,text});
  saveEntries();
  renderEntries();
  document.getElementById("entryTitle").value="";
  document.getElementById("entryText").value="";
};

document.getElementById("themeToggle").onclick=()=>{document.body.classList.toggle("dark");}

// Initial render
renderEntries();
</script>
</body>
</html>
