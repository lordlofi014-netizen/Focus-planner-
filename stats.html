:root{
  --bg1:#4169e1; --bg2:#87ceeb; --bg3:#000080;

}
body.dark{
  --bg1:#4169e1; --bg2:#87ceeb; --bg3:#000080; --card:rgba(0,0,0,0.85); --text:#fff; --btn:#800080;
}
body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,var(--bg1),var(--bg2),var(--bg3));color:var(--text);min-height:100vh;}
.container{max-width:700px;margin:auto;padding:20px;text-align:center;}
h1.title{font-family:'Comic Sans MS',cursive,sans-serif;font-size:2rem;margin-bottom:10px;}
nav{margin-bottom:15px;}
nav button{margin:0 5px;padding:8px 12px;font-weight:bold;border:none;border-radius:5px;cursor:pointer;background:var(--btn);color:#fff;}
.card{background:var(--card);padding:15px;border-radius:12px;text-align:left;margin-bottom:15px;}
button,input{width:100%;padding:10px;margin-top:10px;border:none;border-radius:8px;font-size:16px;}
button{background:var(--btn);color:#fff;cursor:pointer;}
.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center;}
.day{padding:10px;border-radius:5px;background:rgba(255,255,255,0.2);cursor:pointer;}
.day.marked{background:gold;color:#000;font-weight:bold;}
textarea{width:100%;padding:10px;border-radius:8px;margin-top:10px;}
