<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Focus Planner</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
  --bg1:#667eea;
  --bg2:#764ba2;
  --card:rgba(0,0,0,0.3);
  --text:#ffffff;
  --btn:#00d2ff;
}

body.light{
  --bg1:#f5f7fa;
  --bg2:#c3cfe2;
  --card:rgba(255,255,255,0.85);
  --text:#000000;
  --btn:#667eea;
}

body{
  margin:0;
  font-family:Arial, sans-serif;
  background:linear-gradient(135deg,var(--bg1),var(--bg2));
  color:var(--text);
  min-height:100vh;
}

.container{
  max-width:500px;
  margin:auto;
  padding:20px;
}

h1{
  text-align:center;
}

.card{
  background:var(--card);
  padding:15px;
  border-radius:12px;
  margin-bottom:15px;
}

input,button{
  width:100%;
  padding:10px;
  margin-top:10px;
  border:none;
  border-radius:8px;
  font-size:16px;
}

button{
  background:var(--btn);
  color:white;
  cursor:pointer;
}

.task{
  margin-top:10px;
  padding:10px;
  background:rgba(255,255,255,0.15);
  border-radius:8px;
}

.timer{
  font-size:14px;
  margin-top:5px;
}

.toggle{
  text-align:center;
  margin-bottom:10px;
}
</style>
</head>

<body>
<div class="container">
  <h1>Focus Planner</h1>

  <div class="toggle">
    <button id="themeToggle">🌙 Toggle Theme</button>
  </div>

  <div class="card">
    <input id="taskName" placeholder="Task name (Study, Work...)">
    <input id="taskTime" type="number" placeholder="Time in minutes">
    <button id="addTask">Add Task</button>
  </div>

  <div id="tasks"></div>

  <a href="https://youtube.com/@lordlofi-014?si=688afuY83MkdbTpq">
    <button style="margin-top:15px">LORD LOFI EDITZ</button>
  </a>
</div>

<script>
let tasksDiv = document.getElementById("tasks");

document.getElementById("addTask").onclick = function(){
  let name = taskName.value.trim();
  let time = parseInt(taskTime.value);

  if(!name || !time) return;

  let task = document.createElement("div");
  task.className = "task";

  let remaining = time * 60;

  task.innerHTML = `
    <strong>${name}</strong>
    <div class="timer">Time: <span>${time}:00</span></div>
    <button>Start</button>
  `;

  let span = task.querySelector("span");
  let btn = task.querySelector("button");
  let interval;

  btn.onclick = function(){
    if(interval) return;
    interval = setInterval(()=>{
      if(remaining <= 0){
        clearInterval(interval);
        alert(name + " completed!");
        return;
      }
      remaining--;
      let m = Math.floor(remaining/60);
      let s = remaining%60;
      span.textContent = m + ":" + (s<10?"0":"") + s;
    },1000);
  };

  tasksDiv.appendChild(task);
  taskName.value="";
  taskTime.value="";
};

document.getElementById("themeToggle").onclick = function(){
  document.body.classList.toggle("light");
};
</script>

</body>
</html>
