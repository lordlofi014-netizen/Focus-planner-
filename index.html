<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Focus Planner</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
  --bg1:#667eea;
  --bg2:#764ba2;
  --card:rgba(0,0,0,0.3);
  --text:#fff;
  --btn:#00d2ff;
  --danger:#ff4d4d;
}
body.light{
  --bg1:#f5f7fa;
  --bg2:#c3cfe2;
  --card:rgba(255,255,255,0.85);
  --text:#000;
  --btn:#667eea;
}
body{
  margin:0;
  font-family:Arial;
  background:linear-gradient(135deg,var(--bg1),var(--bg2));
  color:var(--text);
  min-height:100vh;
}
.container{max-width:500px;margin:auto;padding:20px;}
h1{text-align:center;}
.card{background:var(--card);padding:15px;border-radius:12px;}
input,button{
  width:100%;
  padding:10px;
  margin-top:10px;
  border:none;
  border-radius:8px;
}
button{background:var(--btn);color:#fff;font-size:16px;}
.task{
  background:rgba(255,255,255,0.15);
  padding:10px;
  border-radius:8px;
  margin-top:10px;
}
.task-buttons{display:flex;gap:10px;}
.delete{background:var(--danger);}
</style>
</head>

<body>
<div class="container">
  <h1>Focus Planner</h1>

  <button id="themeToggle">🌙 Toggle Theme</button>

  <div class="card">
    <input id="taskName" placeholder="Task name">
    <input id="taskTime" type="number" placeholder="Time in minutes">
    <button id="addTask">Add Task</button>
  </div>

  <div id="tasks"></div>

  <a href="https://youtube.com/@lordlofi-014?si=688afuY83MkdbTpq">
    <button style="margin-top:15px">LORD LOFI EDITZ</button>
  </a>
</div>

<script>
const tasksDiv = document.getElementById("tasks");

document.getElementById("addTask").onclick = () => {
  const name = taskName.value.trim();
  const mins = parseInt(taskTime.value);
  if(!name || !mins) return;

  const endTime = Date.now() + mins*60000;

  const task = document.createElement("div");
  task.className = "task";

  task.innerHTML = `
    <strong>${name}</strong>
    <div>Remaining: <span>--:--</span></div>
    <div class="task-buttons">
      <button class="start">Start</button>
      <button class="delete">Delete</button>
    </div>
  `;

  let interval = null;
  const span = task.querySelector("span");

  const update = () => {
    const diff = endTime - Date.now();
    if(diff <= 0){
      clearInterval(interval);
      span.textContent = "00:00";
      alert(name + " completed!");
      return;
    }
    const m = Math.floor(diff/60000);
    const s = Math.floor((diff%60000)/1000);
    span.textContent = m + ":" + (s<10?"0":"") + s;
  };

  task.querySelector(".start").onclick = () => {
    if(interval) return;
    update();
    interval = setInterval(update, 1000);
  };

  task.querySelector(".delete").onclick = () => {
    clearInterval(interval);
    task.remove();
  };

  tasksDiv.appendChild(task);
  taskName.value = "";
  taskTime.value = "";
};

themeToggle.onclick = () => {
  document.body.classList.toggle("light");
};
</script>
</body>
</html>
