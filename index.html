<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>OM SANSKAR - Tasks</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="google-site-verification" content="d0wkB4IEYuCL7a86CknBhYWhtrP8g87WdtquUYa4i4g" />

<!-- PWA Support -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#4169e1">
<link rel="apple-touch-icon" href="icon-192.png">

<style>
:root{
  --bg1:#4169e1; --bg2:#87ceeb; --bg3:#000080;
  --card:rgba(255,255,255,0.85); --text:#000; --btn:#800080;
}
body.dark{
  --bg1:#4169e1; --bg2:#87ceeb; --bg3:#000080; --card:rgba(0,0,0,0.85); --text:#fff; --btn:#800080;
}
body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,var(--bg1),var(--bg2),var(--bg3));color:var(--text);min-height:100vh;}
.container{max-width:700px;margin:auto;padding:20px;text-align:center;}
h1.title{font-family:'Comic Sans MS',cursive,sans-serif;font-size:2rem;margin-bottom:10px;}
nav{margin-bottom:15px;}
nav button{margin:0 5px;padding:8px 12px;font-weight:bold;border:none;border-radius:5px;cursor:pointer;background:var(--btn);color:#fff;}
.card{background:var(--card);padding:15px;border-radius:12px;text-align:left;margin-bottom:15px;}
button,input{width:100%;padding:10px;margin-top:10px;border:none;border-radius:8px;font-size:16px;}
button{background:var(--btn);color:#fff;cursor:pointer;}
textarea{width:100%;padding:10px;border-radius:8px;margin-top:10px;}
</style>
</head>
<body>
<div class="container">
  <h1 class="title">OM SANSKAR - Tasks</h1>

  <!-- Install Button -->
  <button id="installBtn" style="margin:10px 0; background:gold; color:#000; font-weight:bold; display:none;">📲 Install App</button>

  <button id="themeToggle">🌙 Toggle Theme</button>

  <nav>
    <button onclick="location.href='index.html'">Tasks</button>
    <button onclick="location.href='diary.html'">Diary</button>
    <button onclick="location.href='stats.html'">Stats</button>
  </nav>

  <div class="card">
    <h3>Today's Tasks</h3>
    <textarea id="tasks" placeholder="Add your tasks here..."></textarea>
    <button id="saveTasks">Save Tasks</button>
  </div>

</div>

<script>
// ---------- Theme ----------
document.getElementById("themeToggle").onclick=()=>{document.body.classList.toggle("dark");}

// ---------- Save Tasks ----------
document.getElementById("saveTasks").onclick=()=>{
  const tasks=document.getElementById("tasks").value.split("\n").filter(t=>t);
  localStorage.setItem("tasks",JSON.stringify(tasks));
  alert("Tasks saved!");
}

// ---------- PWA Install Button ----------
let deferredPrompt;
const installBtn = document.getElementById('installBtn');
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  installBtn.style.display = 'block';
});
installBtn.addEventListener('click', async () => {
  installBtn.style.display = 'none';
  if (deferredPrompt) {
    deferredPrompt.prompt();
    const { outcome } = await deferredPrompt.userChoice;
    deferredPrompt = null;
    console.log('User response to install:', outcome);
  }
});

// ---------- Service Worker ----------
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('service-worker.js')
  .then(()=>console.log('SW Registered'))
  .catch(err=>console.log('SW Registration Failed:', err));
}

// Load saved tasks
document.addEventListener('DOMContentLoaded', ()=>{
  const saved=JSON.parse(localStorage.getItem("tasks")||"[]");
  document.getElementById("tasks").value=saved.join("\n");
});
</script>
</body>
</html>
