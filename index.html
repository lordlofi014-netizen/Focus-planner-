<!DOCTYPE html>  
<html lang="en">  
<head>  
<meta charset="UTF-8">  
<title>OM SANSKAR - Focus Planner</title>  
<meta name="viewport" content="width=device-width, initial-scale=1.0">  
<meta name="google-site-verification" content="d0wkB4IEYuCL7a86CknBhYWhtrP8g87WdtquUYa4i4g" />  
<meta name="google-adsense-account" content="ca-pub-9976437498625688">  <!-- Added Adsense Meta -->  
<!-- PWA -->  
<link rel="manifest" href="manifest.json">  
<meta name="theme-color" content="#4169e1">  
<link rel="apple-touch-icon" href="icon-192.png">  
<style>  
:root{  
  --bg1:#4169e1; --bg2:#87ceeb; --bg3:#000080;  
  --card:rgba(255,255,255,0.85); --text:#000; --btn:#800080; --danger:#ff4d4d;  
}  
body.dark{  
  --bg1:#4169e1; --bg2:#87ceeb; --bg3:#000080;  
  --card:rgba(0,0,0,0.85); --text:#fff; --btn:#800080;  
}  
body{  
  margin:0;  
  font-family:Arial,sans-serif;  
  background:linear-gradient(135deg,var(--bg1),var(--bg2),var(--bg3));  
  color:var(--text);  
  min-height:100vh;  
}  
.container{max-width:700px;margin:auto;padding:20px;text-align:center;}  
h1.title{font-family:'Comic Sans MS',cursive,sans-serif;font-size:2rem;margin-bottom:10px;}  
nav{margin-bottom:15px;}  
nav button{  
  margin:0 5px;padding:8px 12px;font-weight:bold;  
  border:none;border-radius:5px;cursor:pointer;  
  background:var(--btn);color:#fff;  
}  
.card{  
  background:var(--card);  
  padding:15px;border-radius:12px;  
  text-align:left;margin-bottom:15px;  
}  
input,select,textarea,button{  
  width:100%;padding:10px;margin-top:10px;  
  border:none;border-radius:8px;  
}  
button{background:var(--btn);color:#fff;font-size:16px;cursor:pointer;}  
.task{  
  background:rgba(255,255,255,0.15);  
  padding:10px;border-radius:8px;margin-top:10px;  
}  
.task-buttons{display:flex;gap:10px;margin-top:5px;}  
.delete{background:var(--danger);}  
.progress{height:6px;background:#ccc;border-radius:3px;margin-top:5px;}  
.progress-fill{height:6px;background:var(--btn);border-radius:3px;width:0%;}  
.stars{margin:10px 0;font-size:1.5rem;color:gold;}  
</style>  
</head>  
<body>  
<div class="container">  
  <h1 class="title">OM SANSKAR - Focus Planner</h1>  
  <button id="themeToggle">🌙 Toggle Theme</button>

  <nav>  
    <button onclick="location.href='index.html'">Tasks</button>  
    <button onclick="location.href='diary.html'">Diary</button>  
    <button onclick="location.href='stats.html'">Stats</button>  
  </nav>    
  <div class="stars" id="streakStars"></div>    
  <div class="card">  
    <input id="taskName" placeholder="Task name">  
    <input id="taskTime" type="number" placeholder="Time in minutes">  
    <select id="taskPriority">  
      <option value="High">High Priority</option>  
      <option value="Medium">Medium Priority</option>  
      <option value="Low">Low Priority</option>  
    </select>  
    <button id="addTask">Add Task</button>  
    <h4>Quick Add:</h4>  
    <div id="quickAddButtons"></div>  

    <label>Auto Mode <input type="checkbox" id="autoMode"></label>  
    <label>Gap between tasks (seconds):  
      <input type="number" id="gapTime" value="5" min="0" max="60">  
    </label>
  </div>    
  <div id="tasksList"></div>    
  <a href="https://youtube.com/@lordlofi-014?si=688afuY83MkdbTpq">  
    <button style="margin-top:15px">LORD LOFI EDITZ</button>  
  </a>  
</div>  
<audio id="buzzer" src="https://www.soundjay.com/buttons/sounds/beep-07.mp3" preload="auto"></audio>

<script>  
// ---------- DATA ----------  
let tasks = JSON.parse(localStorage.getItem("tasks") || "[]");  
let streakDays = JSON.parse(localStorage.getItem("streakDays") || "[]");  
  
const tasksDiv = document.getElementById("tasksList");  
const buzzer = document.getElementById("buzzer");  
  
// ---------- QUICK ADD ----------  
const quickTasks = [  
  {name:"Study",time:30,priority:"High"},  
  {name:"Exercise",time:20,priority:"Medium"},  
  {name:"Meditate",time:10,priority:"Medium"},  
  {name:"Read",time:25,priority:"Low"}  
];  
  
const quickDiv = document.getElementById("quickAddButtons");  
quickTasks.forEach(t=>{  
  const btn=document.createElement("button");  
  btn.textContent=t.name;  
  btn.onclick=()=>addTask(t.name,t.time,t.priority);  
  quickDiv.appendChild(btn);  
});  
  
// ---------- FUNCTIONS ----------  
function saveTasks(){localStorage.setItem("tasks",JSON.stringify(tasks));}  
function saveStreak(){localStorage.setItem("streakDays",JSON.stringify(streakDays));}  
  
function addTask(name,time,priority){  
  tasks.push({name,time,priority,completed:false});  
  saveTasks();  
  renderTasks();  
}  
  
document.getElementById("addTask").onclick=()=>{  
  const name=document.getElementById("taskName").value.trim();  
  const time=parseInt(document.getElementById("taskTime").value);  
  const priority=document.getElementById("taskPriority").value;  
  if(!name||!time)return;  
  addTask(name,time,priority);  
  taskName.value=""; taskTime.value="";  
};  
  
// ---------- RENDER ----------  
function renderTasks(){  
  tasksDiv.innerHTML="";  
  const sorted=[...tasks].sort((a,b)=>{  
    const map={High:1,Medium:2,Low:3};  
    return map[a.priority]-map[b.priority];  
  });  
  
  sorted.forEach((task,i)=>{  
    const div=document.createElement("div");  
    div.className="task";  
    div.innerHTML=`  
      <strong>${task.name} (${task.priority})</strong>  
      <div>Remaining: <span>--:--</span></div>  
      <div class="progress"><div class="progress-fill"></div></div>  
      <div class="task-buttons">  
        <button class="start">Start</button>  
        <button class="delete">Delete</button>  
      </div>  
    `;  
    const span=div.querySelector("span");  
    const fill=div.querySelector(".progress-fill");  
    let endTime=null, interval=null;  
  
    const update=()=>{  
      const diff=endTime-Date.now();  
      if(diff<=0){  
        clearInterval(interval);  
        span.textContent="00:00";  
        fill.style.width="100%";  
        tasks[i].completed=true;  
        saveTasks();  
        buzzer.play();  
        updateStreak();  
  
        if(autoMode.checked){  
          const gap=(parseInt(gapTime.value)||5)*1000;  
          setTimeout(()=>startNextTask(i+1),gap);  
        }  
        return;  
      }  
      const m=Math.floor(diff/60000);  
      const s=Math.floor((diff%60000)/1000);  
      span.textContent=m+":"+(s<10?"0":"")+s;  
      fill.style.width=((task.time*60000-diff)/(task.time*60000))*100+"%";  
    };  
  
    div.querySelector(".start").onclick=()=>{  
      if(interval)return;  
      endTime=Date.now()+task.time*60000;  
      update();  
      interval=setInterval(update,1000);  
    };  
  
    div.querySelector(".delete").onclick=()=>{  
      clearInterval(interval);  
      tasks.splice(i,1);  
      saveTasks();  
      renderTasks();  
    };  
  
    tasksDiv.appendChild(div);  
  });  
}  
  
function startNextTask(i){  
  const d=tasksDiv.children[i];  
  if(d)d.querySelector(".start").click();  
}  
  
// ---------- STREAK ----------  
function updateStreak(){  
  const today=new Date().toLocaleDateString();  
  const completed=tasks.filter(t=>t.completed).length;  
  if(completed>=Math.ceil(tasks.length/2) && !streakDays.includes(today)){  
    streakDays.push(today);  
    saveStreak();  
  }  
  renderStars();  
}  
  
function renderStars(){  
  streakStars.innerHTML="⭐".repeat(Math.min(streakDays.length,7));  
}  
  
// ---------- THEME ----------  
themeToggle.onclick=()=>document.body.classList.toggle("dark");  
  
// ---------- INIT ----------  
renderTasks(); renderStars();  
  
// ---------- SERVICE WORKER ----------  
if('serviceWorker' in navigator){  
  navigator.serviceWorker.register('service-worker.js');  
}  
</script>  
</body>  
</html>
